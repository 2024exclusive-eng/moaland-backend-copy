service: k-viewo-backend
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'staging'}
  region: ap-southeast-1
  deploymentBucket: k-viewo
  apiGateway:
    binaryMediaTypes:
      - 'multipart/form-data'
      - 'image/*'
      - 'application/octet-stream'
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
          Resource: "arn:aws:s3:::*/*"

package:
  exclude:
    - .idea/**
    - .vscode/**
    - '*.md'
    - '*.sql'

functions:
  main:
    handler: src/lambda.handler
    memorySize: 512
    timeout: 30
    events:
      - http:
          path: "{proxy+}"
          method: any
          cors: true

plugins:
  - serverless-dotenv-plugin

custom:
  dotenv:
    staging: .env.staging
    production: .env.production
