service: k-viewo-backend
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'staging'}
  region: ap-southeast-1
  deploymentBucket: k-viewo

package:
  exclude:
    - .idea/**
    - .vscode/**
    - '*.md'
    - '*.sql'

functions:
  main:
    handler: src/lambda.handler
    memorySize: 512
    timeout: 30
    events:
      - http:
          path: "{proxy+}"
          method: any
          cors: true

plugins:
  - serverless-dotenv-plugin

custom:
  dotenv:
    staging: .env.staging
    production: .env.production
